[project]
name = "rag-vie"
version = "0.1.0"
description = "Dynamic Hybrid RAG for Vietnamese – Three-way fusion (Dense + BM25 + MLP) using FPT AI Factory"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "openai>=1.82.0",
    "faiss-cpu>=1.9.0",
    "rank-bm25>=0.2.2",
    "underthesea>=6.8.4",
    "torch>=2.6.0",
    "numpy>=2.2.0",
    "pandas>=2.2.0",
    "datasets>=3.6.0",
    "tqdm>=4.67.0",
    "pydantic-settings>=2.9.0",
    "python-dotenv>=1.1.0",
    "scikit-learn>=1.6.0",
    "httpx>=0.28.0",
    "ragas>=0.4.3",
    "langchain-openai>=1.2.1",
    "FlagEmbedding>=1.2.11",
    "tensorflow>=2.20.0",
    "transformers>=4.45.0,<5.0.0",
    "tf-keras>=2.21.0",
]

[project.scripts]
rag-vie = "rag_vie.pipeline:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_vie"]

[dependency-groups]
dev = [
    "ipykernel>=6.29.0",
    "jupyter>=1.1.0",
    "matplotlib>=3.10.0",
    "seaborn>=0.13.0",
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: tests that load heavy ML frameworks (TensorFlow/Keras, BGE-M3) — deselect with -m 'not slow'",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "scripts", "experiments", "tests"]

[tool.ruff.lint]
select = ["E", "F", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Scripts set env vars / import pyarrow BEFORE other imports on purpose
# (OMP deadlock + pyarrow DLL workarounds) — E402 is expected there.
"scripts/*" = ["E402"]
"experiments/*" = ["E402"]

# Force the CUDA build of PyTorch so BGE-M3 sparse encoding (and any future
# GPU-accelerated stages) can run on the local NVIDIA GPU. The default PyPI
# wheels for torch are CPU-only; the cu124 wheel ships with CUDA 12.4 runtime,
# which is backward-compatible with the system's CUDA 13.x driver (NVIDIA
# guarantees forward compatibility from driver → toolkit, not the other way).
[[tool.uv.index]]
name     = "pytorch-cu128"
url      = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
