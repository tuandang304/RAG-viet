[project]
name = "rag-vie"
version = "0.1.0"
description = "Dynamic Hybrid RAG for Vietnamese – Three-way fusion (Dense + BM25 + MLP) using FPT AI Factory"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "openai>=1.82.0",
    "faiss-cpu>=1.9.0",
    "rank-bm25>=0.2.2",
    "underthesea>=6.8.4",
    "torch>=2.6.0",
    "numpy>=2.2.0",
    "pandas>=2.2.0",
    "datasets>=3.6.0",
    "tqdm>=4.67.0",
    "pydantic-settings>=2.9.0",
    "python-dotenv>=1.1.0",
    "scikit-learn>=1.6.0",
    "httpx>=0.28.0",
    "ragas>=0.4.3",
    "langchain-openai>=1.2.1",
    "FlagEmbedding>=1.2.11",
]

[project.scripts]
rag-vie = "rag_vie.pipeline:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_vie"]

[dependency-groups]
dev = [
    "ipykernel>=6.29.0",
    "jupyter>=1.1.0",
    "matplotlib>=3.10.0",
    "seaborn>=0.13.0",
]
